<svg width="1600" height="500" viewBox="0 0 1600 500"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="50%" stop-color="#071A3D"/>
    <stop offset="100%" stop-color="#020617"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0066FF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00D9FF"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1600" height="500" fill="url(#bg)"/>

<!-- GRID -->

<g stroke="#0066FF" stroke-opacity="0.12">

  <path d="M0 100 H1600"/>
  <path d="M0 200 H1600"/>
  <path d="M0 300 H1600"/>
  <path d="M0 400 H1600"/>

  <path d="M100 0 V500"/>
  <path d="M300 0 V500"/>
  <path d="M500 0 V500"/>
  <path d="M700 0 V500"/>
  <path d="M900 0 V500"/>
  <path d="M1100 0 V500"/>
  <path d="M1300 0 V500"/>
  <path d="M1500 0 V500"/>

</g>

<!-- CIRCUIT LINES -->

<g fill="none" stroke="url(#line)" stroke-width="2">

  <path d="M0 120 H220 V80 H420"/>
  <path d="M1600 150 H1380 V210 H1200"/>
  <path d="M0 370 H300 V420 H520"/>
  <path d="M1600 350 H1350 V300 H1120"/>

</g>

<!-- MOVING DATA STREAM -->

<g filter="url(#glow)">

  <circle r="4" fill="#00D9FF">

    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      path="M0 120 H220 V80 H420"/>

  </circle>

  <circle r="4" fill="#7C3AED">

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M1600 150 H1380 V210 H1200"/>

  </circle>

  <circle r="4" fill="#00E676">

    <animateMotion
      dur="6s"
      repeatCount="indefinite"
      path="M0 370 H300 V420 H520"/>

  </circle>

</g>

<!-- PARTICLES -->

<g fill="#00D9FF">

  <circle cx="180" cy="70" r="2">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="650" cy="150" r="2">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="3s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="80" r="2">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="2.5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1400" cy="400" r="2">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="3.5s"
             repeatCount="indefinite"/>
  </circle>

</g>

<!-- CENTRAL COMPUTER CORE -->

<g transform="translate(800 250)" filter="url(#glow)">

  <rect x="-100" y="-60"
        width="200"
        height="120"
        rx="15"
        fill="#020617"
        stroke="#00D9FF"
        stroke-width="2"/>

  <rect x="-70" y="-35"
        width="140"
        height="70"
        rx="8"
        fill="#071A3D"
        stroke="#0066FF"/>

  <text
    x="0"
    y="8"
    text-anchor="middle"
    font-family="monospace"
    font-size="18"
    fill="#00D9FF">

    AI SYSTEM

  </text>

</g>

</svg>
