<svg width="1600" height="500" viewBox="0 0 1600 500"
xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="background"
        x1="0" y1="0"
        x2="1" y2="1">

        <stop offset="0%" stop-color="#020617"/>
        <stop offset="45%" stop-color="#071A3D"/>
        <stop offset="100%" stop-color="#020617"/>

    </linearGradient>

    <linearGradient id="circuit"
        x1="0" y1="0"
        x2="1" y2="0">

        <stop offset="0%"
            stop-color="#0066FF"
            stop-opacity="0"/>

        <stop offset="50%"
            stop-color="#00D9FF"
            stop-opacity="1"/>

        <stop offset="100%"
            stop-color="#7C3AED"
            stop-opacity="0"/>

    </linearGradient>

    <filter id="glow">

        <feGaussianBlur
            stdDeviation="4"
            result="blur"/>

        <feMerge>

            <feMergeNode in="blur"/>

            <feMergeNode
                in="SourceGraphic"/>

        </feMerge>

    </filter>

</defs>


<!-- ====================================================== -->
<!-- BACKGROUND -->
<!-- ====================================================== -->

<rect
    width="1600"
    height="500"
    fill="url(#background)"/>


<!-- ====================================================== -->
<!-- DIGITAL GRID -->
<!-- ====================================================== -->

<g
    stroke="#0066FF"
    stroke-opacity="0.12"
    stroke-width="1">

    <path d="M0 100 H1600"/>
    <path d="M0 200 H1600"/>
    <path d="M0 300 H1600"/>
    <path d="M0 400 H1600"/>

    <path d="M100 0 V500"/>
    <path d="M300 0 V500"/>
    <path d="M500 0 V500"/>
    <path d="M700 0 V500"/>
    <path d="M900 0 V500"/>
    <path d="M1100 0 V500"/>
    <path d="M1300 0 V500"/>
    <path d="M1500 0 V500"/>

</g>


<!-- ====================================================== -->
<!-- CIRCUIT BOARD PATHS -->
<!-- ====================================================== -->

<g
    fill="none"
    stroke="url(#circuit)"
    stroke-width="2">

    <path d="M0 110 H200 V70 H430"/>

    <path d="M1600 130 H1400 V190 H1180"/>

    <path d="M0 380 H250 V430 H520"/>

    <path d="M1600 370 H1360 V310 H1120"/>

    <path d="M250 0 V90 H350"/>

    <path d="M1350 500 V410 H1250"/>

</g>


<!-- ====================================================== -->
<!-- CIRCUIT NODES -->
<!-- ====================================================== -->

<g fill="#00D9FF" filter="url(#glow)">

    <circle cx="200" cy="110" r="4"/>

    <circle cx="1400" cy="130" r="4"/>

    <circle cx="250" cy="380" r="4"/>

    <circle cx="1360" cy="370" r="4"/>

</g>


<!-- ====================================================== -->
<!-- MOVING DATA PACKETS -->
<!-- ====================================================== -->

<g filter="url(#glow)">

    <circle
        r="5"
        fill="#00D9FF">

        <animateMotion
            dur="4s"
            repeatCount="indefinite"
            path="M0 110 H200 V70 H430"/>

    </circle>


    <circle
        r="5"
        fill="#7C3AED">

        <animateMotion
            dur="5s"
            repeatCount="indefinite"
            path="M1600 130 H1400 V190 H1180"/>

    </circle>


    <circle
        r="5"
        fill="#00E676">

        <animateMotion
            dur="6s"
            repeatCount="indefinite"
            path="M0 380 H250 V430 H520"/>

    </circle>


    <circle
        r="5"
        fill="#FF4FD8">

        <animateMotion
            dur="5.5s"
            repeatCount="indefinite"
            path="M1600 370 H1360 V310 H1120"/>

    </circle>

</g>


<!-- ====================================================== -->
<!-- FLOATING PARTICLES -->
<!-- ====================================================== -->

<g>

    <circle
        cx="150"
        cy="80"
        r="2"
        fill="#00D9FF">

        <animate
            attributeName="opacity"
            values="0;1;0"
            dur="2s"
            repeatCount="indefinite"/>

    </circle>


    <circle
        cx="480"
        cy="170"
        r="2"
        fill="#7C3AED">

        <animate
            attributeName="opacity"
            values="0;1;0"
            dur="3s"
            repeatCount="indefinite"/>

    </circle>


    <circle
        cx="680"
        cy="80"
        r="2"
        fill="#00E676">

        <animate
            attributeName="opacity"
            values="0;1;0"
            dur="2.5s"
            repeatCount="indefinite"/>

    </circle>


    <circle
        cx="950"
        cy="130"
        r="2"
        fill="#00D9FF">

        <animate
            attributeName="opacity"
            values="0;1;0"
            dur="3s"
            repeatCount="indefinite"/>

    </circle>


    <circle
        cx="1200"
        cy="70"
        r="2"
        fill="#FF4FD8">

        <animate
            attributeName="opacity"
            values="0;1;0"
            dur="2.2s"
            repeatCount="indefinite"/>

    </circle>


    <circle
        cx="1450"
        cy="420"
        r="2"
        fill="#00D9FF">

        <animate
            attributeName="opacity"
            values="0;1;0"
            dur="3.5s"
            repeatCount="indefinite"/>

    </circle>

</g>


<!-- ====================================================== -->
<!-- CENTRAL COMPUTER CORE -->
<!-- ====================================================== -->

<g
    transform="translate(800 250)"
    filter="url(#glow)">

    <!-- monitor -->

    <rect
        x="-115"
        y="-70"
        width="230"
        height="140"
        rx="18"
        fill="#020617"
        stroke="#00D9FF"
        stroke-width="2"/>


    <!-- screen -->

    <rect
        x="-88"
        y="-45"
        width="176"
        height="90"
        rx="10"
        fill="#071A3D"
        stroke="#0066FF"
        stroke-width="2"/>


    <!-- screen glow -->

    <rect
        x="-72"
        y="-28"
        width="144"
        height="4"
        rx="2"
        fill="#00D9FF">

        <animate
            attributeName="width"
            values="144;80;144"
            dur="2s"
            repeatCount="indefinite"/>

    </rect>


    <rect
        x="-72"
        y="-10"
        width="110"
        height="4"
        rx="2"
        fill="#7C3AED"/>


    <rect
        x="-72"
        y="8"
        width="130"
        height="4"
        rx="2"
        fill="#00E676"/>


    <rect
        x="-72"
        y="26"
        width="85"
        height="4"
        rx="2"
        fill="#FF4FD8"/>


    <!-- monitor stand -->

    <rect
        x="-35"
        y="70"
        width="70"
        height="10"
        rx="5"
        fill="#0066FF"/>

    <rect
        x="-60"
        y="80"
        width="120"
        height="8"
        rx="4"
        fill="#7C3AED"/>


    <!-- AI label -->

    <text
        x="0"
        y="-52"
        text-anchor="middle"
        font-family="monospace"
        font-size="10"
        fill="#00D9FF">

        AI SYSTEM

    </text>

</g>


<!-- ====================================================== -->
<!-- SMALL DATA TERMINALS -->
<!-- ====================================================== -->

<g
    font-family="monospace"
    font-size="12">

    <text
        x="80"
        y="460"
        fill="#00D9FF">

        > system.online

    </text>


    <text
        x="1250"
        y="460"
        fill="#7C3AED">

        > neural_network.active

    </text>

</g>


<!-- ====================================================== -->
<!-- SCANNING LINE -->
<!-- ====================================================== -->

<rect
    x="0"
    y="0"
    width="4"
    height="500"
    fill="#00D9FF"
    opacity="0.25">

    <animate
        attributeName="x"
        from="0"
        to="1600"
        dur="7s"
        repeatCount="indefinite"/>

</rect>

</svg>
